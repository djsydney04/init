name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x86_64
            bundles: app,dmg
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up the installer packaging launcher
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the pinned native Tauri bundler
        shell: bash
        run: |
          version="$(npm exec --yes --package @tauri-apps/cli@2.12.4 -- tauri --version)"
          test "$version" = "tauri-cli 2.12.4"
      - name: Verify the release version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          def version(manifest):
              metadata = json.loads(subprocess.check_output([
                  "cargo", "metadata", "--manifest-path", manifest,
                  "--locked", "--no-deps", "--format-version", "1"
              ]))
              return metadata["packages"][0]["version"]
          root = version("Cargo.toml")
          desktop = version("desktop/Cargo.toml")
          bundle = json.loads(pathlib.Path("desktop/tauri.conf.json").read_text())["version"]
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag), "Invalid version tag"
          assert root == desktop == bundle == tag[1:], "Tag, CLI, and desktop versions must match"
          PY
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check Rust sources
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/Cargo.toml -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Build the CLI and TUI
        run: |
          cargo build --release --locked --bin selfhost
          target/release/selfhost --version
          target/release/selfhost --help
      - name: Build the desktop installers
        working-directory: desktop
        run: npm exec --yes --package @tauri-apps/cli@2.12.4 -- tauri build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Package release downloads
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/selfhost-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C target/release selfhost
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf "dist/selfhost-desktop-${RELEASE_TAG}-${PLATFORM}.app.tar.gz" -C target/release/bundle/macos "Init.app"
            cp target/release/bundle/dmg/*.dmg "dist/selfhost-desktop-${RELEASE_TAG}-${PLATFORM}.dmg"
          else
            cp target/release/bundle/deb/*.deb "dist/selfhost-desktop-${RELEASE_TAG}-${PLATFORM}.deb"
            cp target/release/bundle/appimage/*.AppImage "dist/selfhost-desktop-${RELEASE_TAG}-${PLATFORM}.AppImage"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  sdk:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check SDK versions and contracts
        run: |
          python3 scripts/check-sdk-versions.py "$RELEASE_TAG"
          python3 sdk/tests/contract_server.py python3 sdk/python/test_contract.py
          python3 sdk/tests/contract_server.py node sdk/javascript/test_contract.mjs
          npx --yes --package typescript@5.9.3 tsc --strict --noEmit --module nodenext --target es2022 sdk/javascript/test_types.mts
          python3 sdk/tests/contract_server.py cargo run --manifest-path sdk/rust/Cargo.toml --locked --example contract
      - name: Build SDK downloads
        run: |
          mkdir -p dist
          python3 -m pip install build
          python3 -m build sdk/python --outdir dist
          npm pack ./sdk/javascript --pack-destination dist
          cargo package --manifest-path sdk/rust/Cargo.toml --locked
          cp sdk/rust/target/package/*.crate dist/
      - name: Check installed Python and JavaScript packages
        run: |
          python3 -m venv /tmp/sdk-install
          /tmp/sdk-install/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/sdk-install/bin/python -c 'from selfhost import Client; assert Client().port == 8787')
          mkdir /tmp/sdk-node
          npm install --prefix /tmp/sdk-node --ignore-scripts "$GITHUB_WORKSPACE"/dist/*.tgz
          (cd /tmp/sdk-node && node --input-type=module -e 'import {Client} from "self-host-init-sdk"; new Client()')
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdks
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          paths = sorted(pathlib.Path("dist").iterdir())
          assert len(paths) == 16, f"Expected 12 app and 4 SDK downloads, found {len(paths)}"
          with pathlib.Path("dist/SHA256SUMS").open("w") as checksums:
              for path in paths:
                  digest = hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
                  checksums.write(f"{digest}  {path.name}\n")
          PY
      - name: Publish the prerelease
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Rust service controller with a native Tauri desktop app, CLI, and terminal UI.

          - Workspaces now provide a focused home for grouped services, execution targets, private storage, and deployment. Service Overview and workspace graphs show persistent 24-hour CPU and memory history, observed ranges, and measurement gaps.
          - Settings exposes concurrent jobs, theme, automatic refresh frequency, and the actual runtime, enforcement, paths, and history status.
          - Agents and scripts can preview or apply a service from YAML/JSON files or stdin with structured JSON results and a published schema. The TUI provides the same declaration review and deployment flow.
          - Named project workspaces organize services and use separate managed Docker networks. Each deployed service can have its own persistent, initially empty volume mounted at `/workspace`.
          - Deploy Docker images through a reviewed preview with resource limits, command arguments, loopback ports, optional scheduling, and project placement. The same Rust core supports YAML/JSON configuration, scripts, CLI, and TUI workflows.
          - CPU and memory budget sliders support bounded automatic allocation across managed services.

          Downloads include macOS (Apple silicon and Intel) and Linux (x86_64 and ARM64). The TUI is included in `selfhost`; launch it with `selfhost tui`.

          SDK downloads include a Python wheel and source archive, a JavaScript/TypeScript npm tarball, and a Rust crate. See `sdk/README.md` for installation, API operations, examples, and timeout behavior. All four packages are included in `SHA256SUMS`. This workflow distributes packages here without publishing to PyPI, npm, or crates.io.

          These initial desktop builds are unsigned and are not Apple-notarized. Platform security checks may require explicit approval to open them. Automatic app updates are not enabled. Verify downloads against `SHA256SUMS`.

          The desktop app connects to a compatible local daemon or starts one while the app is open. Existing workloads keep running when the app quits; job scheduling and utilization collection require a running daemon. History begins when this version runs; earlier periods remain gaps. See `docs/releases.md` for setup, upgrade, and build instructions.
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Init $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
