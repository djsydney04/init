name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x86_64
            bundles: app,dmg
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up the installer packaging launcher
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the pinned native Tauri bundler
        shell: bash
        run: |
          version="$(npm exec --yes --package @tauri-apps/cli@2.12.4 -- tauri --version)"
          test "$version" = "tauri-cli 2.12.4"
      - name: Verify the release version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          def version(manifest, expected_name):
              metadata = json.loads(subprocess.check_output([
                  "cargo", "metadata", "--manifest-path", manifest,
                  "--locked", "--no-deps", "--format-version", "1"
              ]))
              package = metadata["packages"][0]
              assert package["name"] == expected_name, f"Unexpected package name: {package['name']}"
              return package["version"]
          root = version("Cargo.toml", "init-core")
          desktop = version("desktop/Cargo.toml", "init-desktop")
          config = json.loads(pathlib.Path("desktop/tauri.conf.json").read_text())
          assert config["productName"] == "Init" and config["mainBinaryName"] == "init-desktop"
          bundle = config["version"]
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag), "Invalid version tag"
          assert root == desktop == bundle == tag[1:], "Tag, CLI, and desktop versions must match"
          PY
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check Rust sources
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/Cargo.toml -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Build the CLI and TUI
        run: |
          cargo build --release --locked --bins
          target/release/init --version
          target/release/init --help
          target/release/selfhost --version
      - name: Build the desktop installers
        working-directory: desktop
        run: npm exec --yes --package @tauri-apps/cli@2.12.4 -- tauri build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Package release downloads
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/init-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C target/release init selfhost
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf "dist/init-desktop-${RELEASE_TAG}-${PLATFORM}.app.tar.gz" -C target/release/bundle/macos "Init.app"
            cp target/release/bundle/dmg/*.dmg "dist/init-desktop-${RELEASE_TAG}-${PLATFORM}.dmg"
          else
            cp target/release/bundle/deb/*.deb "dist/init-desktop-${RELEASE_TAG}-${PLATFORM}.deb"
            cp target/release/bundle/appimage/*.AppImage "dist/init-desktop-${RELEASE_TAG}-${PLATFORM}.AppImage"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  sdk:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check SDK versions and contracts
        run: |
          python3 scripts/check-sdk-versions.py "$RELEASE_TAG"
          python3 sdk/tests/contract_server.py python3 sdk/python/test_contract.py
          python3 sdk/tests/contract_server.py node sdk/javascript/test_contract.mjs
          npx --yes --package typescript@5.9.3 tsc --strict --noEmit --module nodenext --target es2022 sdk/javascript/test_types.mts
          python3 sdk/tests/contract_server.py cargo run --manifest-path sdk/rust/Cargo.toml --locked --example contract
      - name: Build SDK downloads
        run: |
          mkdir -p dist
          python3 -m pip install build
          python3 -m build sdk/python --outdir dist
          npm pack ./sdk/javascript --pack-destination dist
          cargo package --manifest-path sdk/rust/Cargo.toml --locked
          cp sdk/rust/target/package/*.crate dist/
      - name: Check installed Python and JavaScript packages
        run: |
          python3 -m venv /tmp/sdk-install
          /tmp/sdk-install/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/sdk-install/bin/python -c 'from init_sdk import Client; assert Client().port == 8787')
          mkdir /tmp/sdk-node
          npm install --prefix /tmp/sdk-node --ignore-scripts "$GITHUB_WORKSPACE"/dist/*.tgz
          (cd /tmp/sdk-node && node --input-type=module -e 'import {Client} from "init-sdk"; new Client()')
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdks
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          paths = sorted(pathlib.Path("dist").iterdir())
          tag = os.environ["RELEASE_TAG"]
          version = tag[1:]
          expected = {
              f"init-sdk-{version}.crate", f"init-sdk-{version}.tgz",
              f"init_sdk-{version}-py3-none-any.whl", f"init_sdk-{version}.tar.gz",
          }
          for platform in ["macos-aarch64", "macos-x86_64", "linux-x86_64", "linux-aarch64"]:
              expected.add(f"init-{tag}-{platform}.tar.gz")
              for suffix in (["app.tar.gz", "dmg"] if platform.startswith("macos") else ["deb", "AppImage"]):
                  expected.add(f"init-desktop-{tag}-{platform}.{suffix}")
          assert {path.name for path in paths} == expected, "Release download names must match the Init package contract"
          with pathlib.Path("dist/SHA256SUMS").open("w") as checksums:
              for path in paths:
                  digest = hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
                  checksums.write(f"{digest}  {path.name}\n")
          PY
      - name: Publish the prerelease
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Init is a Rust service controller with a native Tauri desktop app, CLI, and terminal UI.

          - The product, commands, packages, and repository now consistently use Init. The primary command is `init`, the desktop executable is `init-desktop`, and all SDK packages are `init-sdk` (Python/Rust import `init_sdk`).
          - The CLI archive includes `selfhost` as a compatibility executable. Existing scripts, saved machine connections, browser preferences, workload ownership, and utilization history continue to work.
          - New workspaces default to `$XDG_DATA_HOME/init` or `~/.local/share/init`. Existing legacy workspaces are reused in place. If both independent default paths exist, select one explicitly with `--workspace`. Do not move an existing workspace: workload ownership is bound to its canonical path.
          - LaunchAgent installation replaces the old controller registration with `io.init.controller`. Install the `init` executable in a user-local directory; never replace the operating system's `/sbin/init`.
          - Includes workspaces with private service storage, live host activity, persistent 24-hour service utilization, budget allocation, settings, and reviewed YAML/JSON deployments through the app, CLI, or TUI.

          Downloads support macOS (Apple silicon and Intel) and Linux (x86_64 and ARM64). Run `init tui` for the terminal interface. SDK downloads include a Python wheel and source archive, a JavaScript/TypeScript npm tarball, and a Rust crate. Packages are distributed here without publishing to PyPI, npm, or crates.io.

          These desktop builds are unsigned and are not Apple-notarized. Platform security checks may require explicit approval to open them. Automatic app updates are not enabled. Verify downloads against `SHA256SUMS`.

          Upgrade the daemon and desktop app together; they require matching versions. Existing workloads keep running when the app quits; job scheduling and utilization collection require a running daemon. See [the rename guide](https://github.com/djsydney04/init/blob/main/docs/migration.md) and [release instructions](https://github.com/djsydney04/init/blob/main/docs/releases.md).
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Init $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
