[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "init-sdk"
version = "0.5.0"
description = "Python client for the local Init service controller"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/djsydney04/init"

[tool.setuptools]
py-modules = ["init_sdk", "selfhost"]
