[package]
name = "self-host-init-sdk"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Async Rust client for the local Self-host Init service controller"
license = "MIT"
repository = "https://github.com/djsydney04/self-host-init"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
